name: build-windows

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Godot 4.7.2
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: true
          include-templates: true

      - name: Compute build version
        id: version
        shell: pwsh
        run: |
          $date = (Get-Date).ToUniversalTime().ToString("yyyy-MM-dd")
          git fetch --tags --force | Out-Null
          $max = 0
          foreach ($tag in (git tag -l "$date-*")) {
            if ($tag -match "^$date-(\d+)$") {
              $n = [int]$Matches[1]
              if ($n -gt $max) { $max = $n }
            }
          }
          $build = "{0:D2}" -f ($max + 1)
          "BUILD_VERSION=$date-$build" >> $env:GITHUB_ENV
          "SEMVER=0.0.0" >> $env:GITHUB_ENV
          Write-Output "Build version: $date-$build"

      - name: Export Windows release
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build/windows | Out-Null
          "Godot: $(godot --version)" | Add-Content $env:GITHUB_STEP_SUMMARY
          $log = "build/export.log"
          & godot --headless --path . --export-release "Windows Desktop" build/windows/iai.exe *>&1 | Tee-Object -FilePath $log
          $code = $LASTEXITCODE
          "exit=$code" | Add-Content $env:GITHUB_STEP_SUMMARY
          Get-Content $log | Add-Content $env:GITHUB_STEP_SUMMARY
          if ($code -ne 0) { throw "Godot export failed: $code" }
          if (-not (Test-Path build/windows/iai.exe)) {
            Get-ChildItem -Recurse build | Out-String | Add-Content $env:GITHUB_STEP_SUMMARY
            throw "Godot export produced no EXE"
          }

      - name: Upload export log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: export-log
          path: build/export.log
          if-no-files-found: warn

      - name: List build output
        shell: pwsh
        run: Get-ChildItem -Recurse build | Select-Object FullName, Length

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: iai-windows
          path: build/windows/
          if-no-files-found: warn

      - name: Verify exported EXE
        shell: pwsh
        run: |
          $exe = Get-Item build/windows/iai.exe -ErrorAction Stop
          Write-Output "EXE: $($exe.FullName) ($($exe.Length) bytes)"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.BUILD_VERSION }}
          name: ${{ env.BUILD_VERSION }}
          body: |
            Semantic version: ${{ env.SEMVER }}
            Build: ${{ env.BUILD_VERSION }}
            Commit: ${{ github.sha }}
          files: build/windows/*.exe
          fail_on_unmatched_files: true
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
