name: build-windows

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Godot 4.7.2
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: true
          include-templates: true

      - name: Compute build version
        id: version
        shell: pwsh
        run: |
          $date = (Get-Date).ToUniversalTime().ToString("yyyy-MM-dd")
          git fetch --tags --force | Out-Null
          $max = 0
          foreach ($tag in (git tag -l "$date-*")) {
            if ($tag -match "^$date-(\d+)$") {
              $n = [int]$Matches[1]
              if ($n -gt $max) { $max = $n }
            }
          }
          $build = "{0:D2}" -f ($max + 1)
          "BUILD_VERSION=$date-$build" >> $env:GITHUB_ENV
          "SEMVER=0.0.0" >> $env:GITHUB_ENV
          Write-Output "Build version: $date-$build"

      - name: Import resources
        shell: pwsh
        run: godot --headless --path . --import

      - name: Export Windows release
        shell: pwsh
        run: |
          $root = $env:GITHUB_WORKSPACE
          New-Item -ItemType Directory -Force "$root/build/windows" | Out-Null
          $godot = $env:GODOT4
          if (-not $godot -or -not (Test-Path $godot)) {
            $godot = (Get-ChildItem "$env:USERPROFILE\godot" -Recurse -Filter "godot*.exe" -ErrorAction SilentlyContinue | Select-Object -First 1).FullName
          }
          if (-not $godot) { $godot = (Get-Command godot.exe -ErrorAction Stop).Source }
          Write-Output "Godot: $godot"
          & $godot --version
          $log = "$root/build/export.log"
          & $godot --headless --path "$root" --export-release "Windows Desktop" "$root/build/windows/iai.exe" *> $log
          $code = $LASTEXITCODE
          Write-Output "exit=$code"
          $logText = if (Test-Path $log) { Get-Content $log -Raw } else { "NO LOG" }
          Write-Output $logText
          $b64 = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($logText)).Replace('+','-').Replace('/','_').TrimEnd('=')
          "LOG_B64=$b64" >> $env:GITHUB_ENV
          if ($code -ne 0) { throw "Godot export failed: $code" }
          if (-not (Test-Path "$root/build/windows/iai.exe")) {
            Get-ChildItem -Recurse "$root/build"
            throw "Godot export produced no EXE"
          }

      - name: Upload export log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: export-log-${{ env.LOG_B64 }}
          path: build/export.log
          if-no-files-found: warn

      - name: List build output
        shell: pwsh
        run: Get-ChildItem -Recurse build | Select-Object FullName, Length

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: iai-windows
          path: build/windows/
          if-no-files-found: warn

      - name: Verify exported EXE
        shell: pwsh
        run: |
          $exe = Get-Item build/windows/iai.exe -ErrorAction Stop
          Write-Output "EXE: $($exe.FullName) ($($exe.Length) bytes)"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.BUILD_VERSION }}
          name: ${{ env.BUILD_VERSION }}
          body: |
            Semantic version: ${{ env.SEMVER }}
            Build: ${{ env.BUILD_VERSION }}
            Commit: ${{ github.sha }}
          files: build/windows/*.exe
          fail_on_unmatched_files: true
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
