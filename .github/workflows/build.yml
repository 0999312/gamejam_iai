name: build-windows

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Godot 4.7.2
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: true
          include-templates: true

      - name: Compute build version
        id: version
        shell: pwsh
        run: |
          $date = (Get-Date).ToUniversalTime().ToString("yyyy-MM-dd")
          git fetch --tags --force | Out-Null
          $max = 0
          foreach ($tag in (git tag -l "$date-*")) {
            if ($tag -match "^$date-(\d+)$") {
              $n = [int]$Matches[1]
              if ($n -gt $max) { $max = $n }
            }
          }
          $build = "{0:D2}" -f ($max + 1)
          "BUILD_VERSION=$date-$build" >> $env:GITHUB_ENV
          "SEMVER=0.0.0" >> $env:GITHUB_ENV
          Write-Output "Build version: $date-$build"

      - name: Import resources
        shell: pwsh
        run: godot --headless --path . --import

      - name: Export Windows release
        shell: pwsh
        run: |
          $root = $env:GITHUB_WORKSPACE
          New-Item -ItemType Directory -Force "$root/build/windows" | Out-Null
          $godot = (Get-Command godot -ErrorAction Stop).Source
          "Godot: $godot" | Add-Content $env:GITHUB_STEP_SUMMARY
          & $godot --version | Add-Content $env:GITHUB_STEP_SUMMARY
          $out = "$root/build/export.out"
          $err = "$root/build/export.err"
          $p = Start-Process -FilePath $godot -ArgumentList @("--headless","--path",$root,"--export-release","Windows Desktop","$root/build/windows/iai.exe") -NoNewWindow -Wait -PassThru -RedirectStandardOutput $out -RedirectStandardError $err
          "exit=$($p.ExitCode)" | Add-Content $env:GITHUB_STEP_SUMMARY
          Get-Content $out, $err -ErrorAction SilentlyContinue | Add-Content $env:GITHUB_STEP_SUMMARY
          if ($p.ExitCode -ne 0) { throw "Godot export failed: $($p.ExitCode)" }
          if (-not (Test-Path "$root/build/windows/iai.exe")) {
            Get-ChildItem -Recurse "$root/build" | Out-String | Add-Content $env:GITHUB_STEP_SUMMARY
            throw "Godot export produced no EXE"
          }

      - name: Upload export log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: export-log
          path: |
            build/export.out
            build/export.err
          if-no-files-found: warn

      - name: List build output
        shell: pwsh
        run: Get-ChildItem -Recurse build | Select-Object FullName, Length

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: iai-windows
          path: build/windows/
          if-no-files-found: warn

      - name: Verify exported EXE
        shell: pwsh
        run: |
          $exe = Get-Item build/windows/iai.exe -ErrorAction Stop
          Write-Output "EXE: $($exe.FullName) ($($exe.Length) bytes)"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.BUILD_VERSION }}
          name: ${{ env.BUILD_VERSION }}
          body: |
            Semantic version: ${{ env.SEMVER }}
            Build: ${{ env.BUILD_VERSION }}
            Commit: ${{ github.sha }}
          files: build/windows/*.exe
          fail_on_unmatched_files: true
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
